<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TroopDark Calculator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#050505;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
overflow:hidden;
}

body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(circle at top left,rgba(255,0,0,.20),transparent 30%),
radial-gradient(circle at bottom right,rgba(255,0,0,.12),transparent 30%),
#050505;
z-index:-2;
}

.grid-bg{
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
background-size:40px 40px;
z-index:-1;
}

.calculator{
width:100%;
max-width:420px;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-radius:30px;
padding:24px;
box-shadow:0 0 45px rgba(255,0,0,.12);
}

.title{
font-size:32px;
font-weight:800;
color:white;
line-height:1.1;
margin-bottom:8px;
}

.subtitle{
font-size:14px;
color:#9ca3af;
margin-bottom:25px;
line-height:1.5;
}

.display{
width:100%;
height:110px;
background:#0b0b0b;
border-radius:24px;
padding:20px;
display:flex;
flex-direction:column;
align-items:flex-end;
justify-content:flex-end;
margin-bottom:22px;
border:1px solid rgba(255,255,255,.05);
overflow:hidden;
}

.history{
font-size:16px;
color:#6b7280;
min-height:22px;
width:100%;
text-align:right;
overflow-x:auto;
}

.result{
font-size:42px;
font-weight:700;
color:white;
width:100%;
text-align:right;
overflow-x:auto;
}

.buttons{
display:grid;
grid-template-columns:repeat(4,1fr);
align-items:center;
gap:14px;
}

button{
height:68px;
border:none;
border-radius:20px;
font-size:22px;
font-weight:700;
cursor:pointer;
transition:.15s;
}

button:active{
transform:scale(.95);
}

.btn-number{
background:#111111;
color:white;
border:1px solid rgba(255,255,255,.04);
}

.btn-number:hover{
background:#191919;
}

.btn-operator{
background:rgba(255,0,0,.18);
color:#ff4d4d;
border:1px solid rgba(255,0,0,.25);
}

.btn-operator:hover{
background:rgba(255,0,0,.28);
}

.btn-equal{
background:linear-gradient(135deg,#ff0000,#7f1d1d);
color:white;
grid-column:span 2;
}

.btn-equal:hover{
box-shadow:0 0 25px rgba(255,0,0,.30);
}

.btn-clear{
background:#1f1f1f;
color:#f87171;
}

.btn-clear:hover{
background:#2a2a2a;
}

@media(max-width:480px){

.calculator{
padding:18px;
}

button{
height:62px;
font-size:20px;
}

.result{
font-size:34px;
}

}
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="calculator">

<div class="title">
TroopDark<br>
Calculator
</div>

<div class="subtitle">
Calculadora profissional moderna com suporte para operações rápidas e precisas.
</div>

<div class="display">
<div class="history" id="history"></div>
<div class="result" id="result">0</div>
</div>

<div class="buttons">

<button class="btn-operator" onclick="appendValue('(')">(</button>
<button class="btn-operator" onclick="appendValue(')')">)</button>
<button class="btn-operator" onclick="appendValue('[')">[</button>
<button class="btn-operator" onclick="appendValue(']')">]</button>

<button class="btn-operator" onclick="appendValue('{')">{</button>
<button class="btn-operator" onclick="appendValue('}')">}</button>
<button class="btn-operator" onclick="appendSquareRoot()">√</button>
<button class="btn-operator" onclick="appendValue('±')">±</button>

<button class="btn-clear" onclick="clearDisplay()">AC</button>
<button class="btn-clear" onclick="deleteLast()">⌫</button>
<button class="btn-operator" onclick="appendValue('%')">%</button>
<button class="btn-operator" onclick="appendValue('÷')">÷</button>

<button class="btn-number" onclick="appendValue('7')">7</button>
<button class="btn-number" onclick="appendValue('8')">8</button>
<button class="btn-number" onclick="appendValue('9')">9</button>
<button class="btn-operator" onclick="appendValue('×')">×</button>

<button class="btn-number" onclick="appendValue('4')">4</button>
<button class="btn-number" onclick="appendValue('5')">5</button>
<button class="btn-number" onclick="appendValue('6')">6</button>
<button class="btn-operator" onclick="appendValue('-')">−</button>

<button class="btn-number" onclick="appendValue('1')">1</button>
<button class="btn-number" onclick="appendValue('2')">2</button>
<button class="btn-number" onclick="appendValue('3')">3</button>
<button class="btn-operator" onclick="appendValue('+')">+</button>

<button class="btn-number" onclick="appendValue('0')">0</button>
<button class="btn-number" onclick="appendValue('.')">.</button>
<button class="btn-operator" onclick="appendValue('π')">π</button>
<button class="btn-operator" onclick="appendValue('≈')">≈</button>
<button class="btn-operator" onclick="appendValue('≠')">≠</button>
<button class="btn-equal" onclick="calculate()">=</button>

</div>

</div>

<script>
const result = document.getElementById('result');
const historyDisplay = document.getElementById('history');

let currentInput = '';

function appendSquareRoot(){

if(result.textContent === 'Erro'){
clearDisplay();
}

currentInput += '√';
result.textContent = currentInput;
}

function appendValue(value){

if(result.textContent === 'Erro'){
clearDisplay();
}

currentInput += value;
result.textContent = currentInput;
}

function clearDisplay(){
currentInput = '';
result.textContent = '0';
historyDisplay.textContent = '';
}

function deleteLast(){
currentInput = currentInput.slice(0,-1);
result.textContent = currentInput || '0';
}

function calculate(){

try{

let expression = currentInput
.replace(/×/g,'*')
.replace(/÷/g,'/')
.replace(/√/g,'Math.sqrt')
.replace(/π/g,'Math.PI')
.replace(/±/g,'');

const calculation = eval(expression);

historyDisplay.textContent = currentInput + ' =';

result.textContent = calculation;

currentInput = calculation.toString();

}catch(error){

result.textContent = 'Erro';
currentInput = '';

}
}

document.addEventListener('keydown',(event)=>{

const allowed = '0123456789+-*/.%()[]{}';

if(allowed.includes(event.key)){

if(event.key === '*'){
appendValue('×');
}else if(event.key === '/'){
appendValue('÷');
}else{
appendValue(event.key);
}

}

if(event.key === 'Enter'){
calculate();
}

if(event.key === 'Backspace'){
deleteLast();
}

if(event.key === 'Escape'){
clearDisplay();
}

});

console.assert(typeof calculate === 'function','Função calculate deve existir');
console.assert(typeof appendValue === 'function','Função appendValue deve existir');
console.assert(result !== null,'Display da calculadora deve existir');
</script>

</body>
</html>
